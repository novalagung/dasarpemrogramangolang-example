<!DOCTYPE html>
<html>
	<head>
		<title>JSON Payload</title>
		<script>
			document.addEventListener("DOMContentLoaded", function () {
				document.getElementById("user-form").addEventListener("submit", async function (e) {
					e.preventDefault();

					const form = e.target;
					const payload = JSON.stringify({
						name: document.querySelector('[name="name"]').value,
						age: parseInt(document.querySelector('[name="age"]').value, 10),
						gender: document.querySelector('[name="gender"]').value,
					});

					try {
						const res = await fetch(form.action, {
							method: form.method,
							headers: { "Content-Type": "application/json" },
							body: payload,
						});
						const text = await res.text();
						if (!res.ok) throw new Error(text);
						document.querySelector(".message").textContent = text;
					} catch (err) {
						alert("ERROR: " + err.message);
					}
				});
			});
		</script>
	</head>
	<body>
		<p class="message"></p>
		<form id="user-form" method="post" action="/save">
			<table noborder>
				<tr>
					<td>
						<label>Name :</label>
					</td>
					<td>
						<input required type="text" name="name" placeholder="Type name here" />
					</td>
				</tr>
				<tr>
					<td>
						<label>Age :</label>
					</td>
					<td>
						<input required type="number" name="age" placeholder="Set age" />
					</td>
				</tr>
				<tr>
					<td>
						<label>Gender :</label>
					</td>
					<td>
						<select name="gender" required style="width: 100%;">
							<option value="">Select one</option>
							<option value="male">Male</option>
							<option value="female">Female</option>
						</select>
					</td>
				</tr>
				<tr>
					<td colspan="2" style="text-align: right;">
						<button type="submit">Save</button>
					</td>
				</tr>
			</table>
		</form>
	</body>
</html>
